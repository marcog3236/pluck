<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    background: linear-gradient(145deg, #1a1a3c 0%, #0e0e28 50%, #141430 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Subtle felt texture effect */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(60,50,100,0.25) 0%, transparent 70%);
  }

  /* Heart container — centered */
  .heart-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 8px 30px rgba(245,180,60,0.3));
  }

  /* CSS heart — gradient fill via background on wrapper */
  .heart {
    width: 340px;
    height: 340px;
    background: linear-gradient(135deg, #f59e0b 0%, #ef4444 60%, #dc2626 100%);
    transform: rotate(45deg);
    position: relative;
    border-radius: 4px;
  }
  .heart::before,
  .heart::after {
    content: '';
    width: 340px;
    height: 340px;
    background: inherit;
    border-radius: 50%;
    position: absolute;
  }
  .heart::before { left: -170px; top: 0; }
  .heart::after { top: -170px; left: 0; }

  /* Subtle card outlines behind — hint at "card game" */
  .card-hint {
    position: absolute;
    width: 340px;
    height: 480px;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 20px;
  }
  .card-hint-1 { transform: rotate(-8deg) translate(-60px, 20px); }
  .card-hint-2 { transform: rotate(8deg) translate(60px, 20px); }
  .card-hint-3 { transform: rotate(0deg); border-color: rgba(255,255,255,0.12); }
</style>
</head>
<body>
  <!-- Main heart -->
  <div class="heart-wrap">
    <div class="heart"></div>
  </div>
</body>
</html>
