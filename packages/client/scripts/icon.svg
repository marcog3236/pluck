<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e2a"/>
      <stop offset="100%" stop-color="#1a1a3c"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="140%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="4" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Symmetric heart: right half drawn, then mirrored -->
    <path id="heart-half-r" d="M0,-10 C0,-10 0,-45 25,-45 C50,-45 50,-20 50,-10 C50,5 25,30 0,50 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Card — big, nearly fills frame, slight tilt -->
  <g transform="translate(512, 500) rotate(-2)" filter="url(#shadow)">
    <!-- Card body -->
    <rect x="-310" y="-420" width="620" height="840" rx="36" fill="#fffefd"/>
    <rect x="-307" y="-417" width="614" height="834" rx="34" fill="none" stroke="#e5e5e5" stroke-width="2"/>

    <!-- ═══ Center heart (symmetric, bold) ═══ -->
    <g transform="translate(0, 20)">
      <!-- Right half -->
      <path d="M0,120 C0,120 0,-50 120,-110 C200,-150 240,-70 240,10 C240,100 120,200 0,280 Z" fill="#dc2626"/>
      <!-- Left half (mirrored) -->
      <path d="M0,120 C0,120 0,-50 -120,-110 C-200,-150 -240,-70 -240,10 C-240,100 -120,200 0,280 Z" fill="#dc2626"/>
    </g>

    <!-- ═══ Top-left corner ═══ -->
    <text x="-252" y="-305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#dc2626">A</text>
    <!-- Small heart -->
    <g transform="translate(-224, -248) scale(0.55)">
      <path d="M0,20 C0,20 0,-10 20,-20 C35,-28 40,-12 40,0 C40,16 20,34 0,48 Z" fill="#dc2626"/>
      <path d="M0,20 C0,20 0,-10 -20,-20 C-35,-28 -40,-12 -40,0 C-40,16 -20,34 0,48 Z" fill="#dc2626"/>
    </g>

    <!-- ═══ Bottom-right corner (rotated 180°) ═══ -->
    <g transform="rotate(180)">
      <text x="-252" y="-305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#dc2626">A</text>
      <g transform="translate(-224, -248) scale(0.55)">
        <path d="M0,20 C0,20 0,-10 20,-20 C35,-28 40,-12 40,0 C40,16 20,34 0,48 Z" fill="#dc2626"/>
        <path d="M0,20 C0,20 0,-10 -20,-20 C-35,-28 -40,-12 -40,0 C-40,16 -20,34 0,48 Z" fill="#dc2626"/>
      </g>
    </g>
  </g>
</svg>
